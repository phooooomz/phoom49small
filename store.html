<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ร้านค้า | Developer Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter & Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- Custom External Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0D0F12',
                            card: '#15181D',
                            cardSec: '#1A1E24',
                            text: '#F1F5F9',
                            muted: '#9299A5',
                            border: '#262B33',
                            accent: '#60A5FA'
                        },
                        light: {
                            bg: '#F7F8FA',
                            card: '#FFFFFF',
                            cardSec: '#F1F3F7',
                            text: '#17191D',
                            muted: '#737B87',
                            border: '#E8EAEE',
                            accent: '#2563EB'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Kanit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-dark-text light:bg-light-bg light:text-light-text font-sans antialiased min-h-screen transition-clean flex flex-col justify-between" style="padding-bottom: calc(6rem + env(safe-area-inset-bottom));">

    <!-- GLOBAL TAB BAR / NAVIGATION HEADER -->
    <header class="sticky top-0 z-50 bg-dark-bg/90 light:bg-light-bg/90 backdrop-blur-md border-b border-dark-border light:border-light-border px-4 py-3">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-dark-cardSec light:bg-light-cardSec flex items-center justify-center font-mono text-xs font-semibold text-dark-accent light:text-light-accent border border-dark-border light:border-light-border">
                    DV
                </div>
                <span class="font-medium text-sm text-dark-text light:text-light-text hidden sm:inline-block" data-i18n="name">อเล็กซ์ ริเวร่า</span>
            </a>

            <!-- Navigation Links (Font Awesome Icon Tab Bar) -->

            <!-- Actions: Language & Theme Switchers -->
            <div class="flex items-center gap-2">
                <button onclick="toggleLanguage()" class="px-2.5 py-1.5 rounded-lg text-xs font-mono font-medium text-dark-muted light:text-light-muted hover:text-dark-text light:hover:text-light-text hover:bg-dark-cardSec light:hover:bg-light-cardSec border border-dark-border light:border-light-border transition-clean">
                    <span id="lang-indicator">TH</span>
                </button>

                <button onclick="toggleTheme()" class="p-2 rounded-lg text-dark-muted light:text-light-muted hover:text-dark-text light:hover:text-light-text hover:bg-dark-cardSec light:hover:bg-light-cardSec transition-clean" aria-label="Toggle Theme">
                    <i data-feather="sun" class="w-4 h-4 hidden dark:block"></i>
                    <i data-feather="moon" class="w-4 h-4 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-2 pb-8 w-full space-y-6">
        
        <section class="space-y-4">
            <h1 class="text-xl font-bold text-dark-text light:text-light-text" data-i18n="store_title">ของแจกฟรี</h1>
            <p class="text-xs text-dark-muted light:text-light-muted" data-i18n="store_subtitle">เทมเพลตและไฟล์คุณภาพ กดรับได้ฟรีเลย</p>

            <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                <p class="text-xs text-dark-muted">กำลังโหลด...</p>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-dark-border light:border-light-border py-6 text-center text-xs text-dark-muted light:text-light-muted font-mono" data-i18n="footer">
        © 2026 อเล็กซ์ ริเวร่า. สงวนลิขสิทธิ์ทั้งหมด
    </footer>

    <!-- BOTTOM TAB BAR -->
    <nav class="fixed inset-x-0 z-50 px-4 pointer-events-none" style="bottom: calc(0.75rem + env(safe-area-inset-bottom));">
        <div class="pointer-events-auto max-w-sm mx-auto flex items-stretch gap-1 p-1.5 rounded-2xl glass-bar">
        <a href="index.html" class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 rounded-xl transition-clean" aria-label="หน้าแรก">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px]" data-i18n="tab_home">หน้าแรก</span>
        </a>
        <a href="store.html" class="tab-btn active flex-1 flex flex-col items-center gap-0.5 py-2 rounded-xl transition-clean" aria-label="แจกฟรี">
            <i class="fa-solid fa-gift text-lg"></i>
            <span class="text-[10px]" data-i18n="tab_store">แจกฟรี</span>
        </a>
        <a href="about.html" class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 rounded-xl transition-clean" aria-label="เกี่ยวกับ">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px]" data-i18n="tab_about">เกี่ยวกับ</span>
        </a>
        <a href="contact.html" class="tab-btn flex-1 flex flex-col items-center gap-0.5 py-2 rounded-xl transition-clean" aria-label="ติดตาม">
            <i class="fa-solid fa-share-nodes text-lg"></i>
            <span class="text-[10px]" data-i18n="tab_contact">ติดตาม</span>
        </a>
        </div>
    </nav>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script src="app.js"></script>
</body>
</html>
